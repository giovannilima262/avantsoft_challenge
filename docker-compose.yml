version: '3.8'

services:
  db:
    container_name: db_container
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - databaseavantsoft:/var/lib/postgresql/data/

  web:
    build: .
    working_dir: /app
    container_name: web
    ports:
      - 3000:3000
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && rails s -b 0.0.0.0"
    volumes:
      - .:/app
      - rubygems:/usr/local/bundle
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
 
volumes:
  databaseavantsoft:
  rubygems: